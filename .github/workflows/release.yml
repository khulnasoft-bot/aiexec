name: Primeagent Release
run-name: Primeagent Release by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to release from. This is the tag that contains the source code for the release."
        required: true
        type: string
      release_package_base:
        description: "Release Primeagent Base"
        required: true
        type: boolean
        default: false
      release_package_main:
        description: "Release Primeagent"
        required: true
        type: boolean
        default: false
      release_wfx:
        description: "Release WFX package (manually triggered)"
        required: false
        type: boolean
        default: false
      build_docker_base:
        description: "Build Docker Image for Primeagent Base"
        required: true
        type: boolean
        default: false
      build_docker_main:
        description: "Build Docker Image for Primeagent"
        required: true
        type: boolean
        default: false
      pre_release:
        description: "Pre-release"
        required: false
        type: boolean
        default: false
      create_release:
        description: "Whether to create a gh release"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Dry run mode - disables all pushes to external services (PyPI, Docker, GitHub releases)"
        required: false
        type: boolean
        default: true

jobs:
  echo-inputs:
    name: Echo Workflow Inputs
    runs-on: ubuntu-latest
    steps:
      - name: Echo workflow inputs
        run: |
          echo "release_tag: ${{ inputs.release_tag }}"
          echo "release_package_base: ${{ inputs.release_package_base }}"
          echo "release_package_main: ${{ inputs.release_package_main }}"
          echo "release_wfx: ${{ inputs.release_wfx }}"
          echo "build_docker_base: ${{ inputs.build_docker_base }}"
          echo "build_docker_main: ${{ inputs.build_docker_main }}"
          echo "pre_release: ${{ inputs.pre_release }}"
          echo "create_release: ${{ inputs.create_release }}"
          echo "dry_run: ${{ inputs.dry_run }}"

  validate-tag:
    name: Validate Tag Input
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch all history - required for tags (?)
      - name: Validate that input is a tag, not a branch
        run: |
          # Check if the input exists as a tag
          if ! git tag -l | grep -q "^${{ inputs.release_tag }}$"; then
            echo "Error: '${{ inputs.release_tag }}' is not a valid tag."
            echo "Available tags:"
            git tag -l | head -20
            exit 1
          fi

          # Check if the input also exists as a branch (warn if so, but don't fail)
          if git branch -r | grep -q "origin/${{ inputs.release_tag }}$"; then
            echo "Tag '${{ inputs.release_tag }}' also exists as a branch. Exiting out of caution."
            exit 1
          fi

          echo "Validated: '${{ inputs.release_tag }}' is a valid tag."

  validate-dependencies:
    name: Validate Release Dependencies
    runs-on: ubuntu-latest
    if: ${{ inputs.release_package_base || inputs.release_package_main || inputs.release_wfx || inputs.build_docker_base || inputs.build_docker_main }}
    needs: [validate-tag]
    steps:
      - name: Validate that build-base is enabled if build-main is enabled
        run: |
          if [ "${{ inputs.release_package_main }}" = "true" ] && [ "${{ inputs.release_package_base }}" = "false" ]; then
            echo "Error: Cannot release Primeagent Main without releasing Primeagent Base."
            echo "Please enable 'release_package_base' or disable 'release_package_main'."
            exit 1
          fi

          echo "✅ Release dependencies validated successfully."

  ci:
    name: CI
    needs: [validate-tag, validate-dependencies]
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.release_tag }}
      python-versions: "['3.10', '3.11', '3.12', '3.13']"
      frontend-tests-folder: "tests"
      release: true
      run-all-tests: true
      runs-on: ubuntu-latest
    secrets: inherit

  # Automatically ensure wfx is published before building primeagent-base
  # This job checks if the required wfx version exists on PyPI and publishes it if not
  ensure-wfx-published:
    name: Ensure WFX Dependency is Published
    needs: [ci]
    if: ${{ inputs.release_package_base }}
    runs-on: ubuntu-latest
    outputs:
      wfx-version: ${{ steps.check-wfx.outputs.wfx_version }}
      wfx-published: ${{ steps.check-wfx.outputs.already_published }}
      wfx-published-now: ${{ steps.publish-wfx.outputs.published }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}

      - name: Setup Environment
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"
          prune-cache: false

      - name: Check WFX version requirement
        id: check-wfx
        run: |
          # Get the wfx version required by primeagent-base from pyproject.toml
          cd src/backend/base
          WFX_REQUIREMENT=$(grep -E "^\s*\"wfx" pyproject.toml | head -1 | sed 's/.*wfx[~>=<]*//' | sed 's/[",].*//')
          echo "WFX requirement from primeagent-base: $WFX_REQUIREMENT"

          # Get the actual wfx version from source
          cd ../../wfx
          WFX_SOURCE_VERSION=$(grep -E "^version\s*=" pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "WFX source version: $WFX_SOURCE_VERSION"
          echo "wfx_version=$WFX_SOURCE_VERSION" >> $GITHUB_OUTPUT

          # Check if this version exists on PyPI
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/wfx/$WFX_SOURCE_VERSION/json")

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ WFX version $WFX_SOURCE_VERSION already exists on PyPI"
            echo "already_published=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ WFX version $WFX_SOURCE_VERSION NOT found on PyPI (HTTP: $HTTP_STATUS)"
            echo "Will build and publish WFX first..."
            echo "already_published=false" >> $GITHUB_OUTPUT
          fi

      - name: Install WFX dependencies
        if: steps.check-wfx.outputs.already_published == 'false'
        run: uv sync --frozen --dev --package wfx

      - name: Build WFX
        if: steps.check-wfx.outputs.already_published == 'false'
        run: |
          cd src/wfx
          rm -rf dist/
          uv build --wheel --out-dir dist
          echo "Built WFX wheel:"
          ls -la dist/

      - name: Test WFX CLI
        if: steps.check-wfx.outputs.already_published == 'false'
        run: |
          cd src/wfx
          uv pip install dist/*.whl --force-reinstall
          uv run wfx --help
          echo "✅ WFX CLI test passed"

      - name: Publish WFX to PyPI
        id: publish-wfx
        if: steps.check-wfx.outputs.already_published == 'false' && !inputs.dry_run
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          cd src/wfx
          echo "Publishing WFX ${{ steps.check-wfx.outputs.wfx_version }} to PyPI..."
          uv publish dist/*.whl
          echo "published=true" >> $GITHUB_OUTPUT
          echo "✅ WFX published successfully"

      - name: Wait for PyPI propagation
        if: steps.publish-wfx.outputs.published == 'true'
        run: |
          echo "Waiting 60 seconds for PyPI propagation..."
          sleep 60

          # Verify the package is available
          WFX_VERSION="${{ steps.check-wfx.outputs.wfx_version }}"
          for i in {1..5}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/wfx/$WFX_VERSION/json")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ WFX $WFX_VERSION is now available on PyPI"
              exit 0
            fi
            echo "Attempt $i: WFX not yet available (HTTP: $HTTP_STATUS), waiting 30s..."
            sleep 30
          done
          echo "❌ WFX $WFX_VERSION still not available on PyPI after waiting"
          exit 1

      - name: Skip publishing (dry run)
        if: steps.check-wfx.outputs.already_published == 'false' && inputs.dry_run
        run: |
          echo "⚠️ DRY RUN: Would have published WFX ${{ steps.check-wfx.outputs.wfx_version }} to PyPI"
          echo "In actual release, this step will publish the package"

  build-base:
    name: Build Primeagent Base
    needs: [ci, ensure-wfx-published]
    if: ${{ inputs.release_package_base }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check-version.outputs.version }}
      skipped: ${{ steps.check-version.outputs.skipped }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
      - name: Setup Environment
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"
          prune-cache: false
      - name: Install the project
        run: uv sync --frozen
      - name: Check for dependency incompatibility
        run: uv pip check
      - name: Check Version
        id: check-version
        run: |
          version=$(uv tree | grep 'primeagent-base' | awk '{print $3}' | sed 's/^v//' | head -n 2 | xargs)
          last_released_version=$(curl -s "https://pypi.org/pypi/primeagent-base/json" | jq -r '.releases | keys | .[]' | sort -V | tail -n 1)
          if [ "$version" = "$last_released_version" ]; then
            echo "Version $version is already released. Skipping release."
            echo skipped=true >> $GITHUB_OUTPUT
            exit 1
          else
            echo version=$version >> $GITHUB_OUTPUT
            echo skipped=false >> $GITHUB_OUTPUT
          fi
      - name: Build project for distribution
        if: steps.check-version.outputs.skipped == 'false'
        run: make build base=true args="--wheel"
      - name: Test CLI
        if: steps.check-version.outputs.skipped == 'false'
        run: |
          # TODO: Unsure why the whl is not built in src/backend/base/dist
          mkdir src/backend/base/dist
          mv dist/*.whl src/backend/base/dist
          uv pip install src/backend/base/dist/*.whl
          uv run python -m primeagent run --host localhost --port 7860 --backend-only &
          SERVER_PID=$!
          # Wait for the server to start
          timeout 120 bash -c 'until curl -f http://localhost:7860/api/v1/auto_login; do sleep 2; done' || (echo "Server did not start in time" && kill $SERVER_PID && exit 1)
          # Terminate the server
          kill $SERVER_PID || (echo "Failed to terminate the server" && exit 1)
          sleep 20 # give the server some time to terminate
          # Check if the server is still running
          if kill -0 $SERVER_PID 2>/dev/null; then
            echo "Failed to terminate the server"
            exit 0
          else
            echo "Server terminated successfully"
          fi

      # PyPI publishing moved to after cross-platform testing

      - name: Upload Artifact
        if: steps.check-version.outputs.skipped == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: dist-base
          path: src/backend/base/dist

  build-main:
    name: Build Primeagent Main
    if: ${{ inputs.release_package_main }}
    needs: [build-base]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
      - name: Setup Environment
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"
          prune-cache: false
      - name: Install the project
        run: uv sync --frozen
      - name: Check for dependency incompatibility
        run: uv pip check

      # If pre-release is true, we need to check if  ["a", "b", "rc", "dev", "post"] is in the version string
      # if the version string is incorrect, we need to exit the workflow
      - name: Check if pre-release
        if: inputs.pre_release
        run: |
          version="${{ inputs.release_tag }}"
          echo "$version"
          if [[ "${version}" =~ ^([0-9]+\.)?([0-9]+\.)?[0-9]+((a|b|rc|dev|post)([0-9]+))$ ]]; then
            echo "Pre-release version detected. Continuing with the release."
          else
            echo "Invalid pre-release version detected. Exiting the workflow."
            exit 1
          fi
      - name: Check Version
        id: check-version
        run: |
          version=$(uv tree | grep 'primeagent' | grep -v 'primeagent-base' | awk '{print $2}' | sed 's/^v//')
          last_released_version=$(curl -s "https://pypi.org/pypi/primeagent/json" | jq -r '.releases | keys | .[]' | sort -V | tail -n 1)
          if [ "$version" = "$last_released_version" ]; then
            echo "Version $version is already released. Skipping release."
            echo skipped=true >> $GITHUB_OUTPUT
            exit 1
          else
            echo version=$version >> $GITHUB_OUTPUT
          fi
      - name: Wait for PyPI Propagation
        if: needs.build-base.outputs.skipped == 'false'
        run: sleep 300 # wait for 5 minutes to ensure PyPI propagation

      - name: Build project for distribution
        run: make build main=true args="--no-sources --wheel"
      - name: Test CLI
        run: |
          uv pip install dist/*.whl
          uv run python -m primeagent run --host localhost --port 7860 --backend-only &
          SERVER_PID=$!
          # Wait for the server to start
          timeout 120 bash -c 'until curl -f http://localhost:7860/health_check; do sleep 2; done' || (echo "Server did not start in time" && kill $SERVER_PID && exit 1)
          # Terminate the server
          kill $SERVER_PID || (echo "Failed to terminate the server" && exit 1)
          sleep 20 # give the server some time to terminate
          # Check if the server is still running
          if kill -0 $SERVER_PID 2>/dev/null; then
            echo "Failed to terminate the server"
            exit 0
          else
            echo "Server terminated successfully"
          fi

      # PyPI publishing moved to after cross-platform testing

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-main
          path: dist

  build-wfx:
    name: Build WFX
    needs: [build-base]
    if: ${{ inputs.release_wfx }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
      - name: Setup Environment
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"
          prune-cache: false
      - name: Install WFX dependencies
        run: uv sync --frozen --dev --package wfx
      - name: Check Version
        id: check-version
        run: |
          cd src/wfx
          version=$(uv tree | grep 'wfx' | head -n 1 | awk '{print $2}' | sed 's/^v//')
          last_released_version=$(curl -s "https://pypi.org/pypi/wfx/json" | jq -r '.releases | keys | .[]' | sort -V | tail -n 1)
          if [ "$version" = "$last_released_version" ]; then
            echo "Version $version is already released. Skipping release."
            exit 1
          else
            echo version=$version >> $GITHUB_OUTPUT
          fi
      - name: Build project for distribution
        run: |
          cd src/wfx
          rm -rf dist/
          uv build --wheel --out-dir dist
      - name: Test CLI
        run: |
          cd src/wfx
          uv pip install dist/*.whl --force-reinstall
          uv run wfx --help
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-wfx
          path: src/wfx/dist

  test-cross-platform:
    name: Test Cross-Platform Installation
    needs: [build-base, build-main]
    if: |
      always() &&
      !cancelled() &&
      (needs.build-base.result == 'success' || needs.build-main.result == 'success')
    uses: ./.github/workflows/cross-platform-test.yml
    with:
      base-artifact-name: "dist-base"
      main-artifact-name: "dist-main"
      wfx-artifact-name: "${{ inputs.release_wfx && 'dist-wfx' || '' }}"

  publish-base:
    name: Publish Primeagent Base to PyPI
    if: ${{ inputs.release_package_base }}
    needs: [build-base, test-cross-platform]
    runs-on: ubuntu-latest
    steps:
      - name: Download base artifact
        uses: actions/download-artifact@v5
        with:
          name: dist-base
          path: src/backend/base/dist
      - name: Setup Environment
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
          python-version: "3.13"
      - name: Publish base to PyPI
        if: ${{ !inputs.dry_run }}
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          cd src/backend/base && uv publish dist/*.whl

  publish-main:
    name: Publish Primeagent Main to PyPI
    if: ${{ inputs.release_package_main }}
    needs: [build-main, test-cross-platform, publish-base]
    runs-on: ubuntu-latest
    steps:
      - name: Download main artifact
        uses: actions/download-artifact@v5
        with:
          name: dist-main
          path: dist
      - name: Setup Environment
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
          python-version: "3.13"
      - name: Publish main to PyPI
        if: ${{ !inputs.dry_run }}
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          uv publish dist/*.whl

  publish-wfx:
    name: Publish WFX to PyPI
    if: ${{ inputs.release_wfx }}
    needs: [build-wfx, test-cross-platform]
    runs-on: ubuntu-latest
    steps:
      - name: Download WFX artifact
        uses: actions/download-artifact@v5
        with:
          name: dist-wfx
          path: src/wfx/dist
      - name: Setup Environment
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
          python-version: "3.13"
      - name: Publish WFX to PyPI
        if: ${{ !inputs.dry_run }}
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          cd src/wfx && uv publish dist/*.whl

  # test-wfx-cross-platform:
  #   name: Test WFX Cross-Platform Installation
  #   if: ${{ inputs.release_wfx }}
  #   needs: [build-wfx]
  #   runs-on: ${{ matrix.os }}
  #   strategy:
  #     matrix:
  #       os: [ubuntu-latest, windows-latest, macos-latest]
  #       python-version: ["3.10", "3.11", "3.12", "3.13"]
  #   steps:
  #     - name: Download WFX artifact
  #       uses: actions/download-artifact@v5
  #       with:
  #         name: dist-wfx
  #         path: dist-wfx
  #     - name: Setup Environment
  #       uses: astral-sh/setup-uv@v6
  #       with:
  #         enable-cache: false
  #         python-version: ${{ matrix.python-version }}
  #     - name: Test WFX installation
  #       run: |
  #         uv pip install dist-wfx/*.whl
  #         uv run wfx --help

  call_docker_build_base:
    name: Call Docker Build Workflow for Primeagent Base
    if: ${{ inputs.build_docker_base }}
    needs: [ci]
    uses: ./.github/workflows/docker-build-v2.yml
    with:
      ref: ${{ inputs.release_tag }}
      release_type: base
      pre_release: ${{ inputs.pre_release }}
      push_to_registry: ${{ !inputs.dry_run }}
    secrets: inherit

  call_docker_build_main:
    name: Call Docker Build Workflow for Primeagent
    if: ${{ inputs.build_docker_main }}
    needs: [ci]
    uses: ./.github/workflows/docker-build-v2.yml
    with:
      ref: ${{ inputs.release_tag }}
      release_type: main
      pre_release: ${{ inputs.pre_release }}
      push_to_registry: ${{ !inputs.dry_run }}
    secrets: inherit

  call_docker_build_main_backend:
    name: Call Docker Build Workflow for Primeagent Backend
    if: ${{ inputs.build_docker_main && !inputs.dry_run }}
    needs: [call_docker_build_main]
    uses: ./.github/workflows/docker-build-v2.yml
    with:
      ref: ${{ inputs.release_tag }}
      release_type: main-backend
      pre_release: ${{ inputs.pre_release }}
      push_to_registry: ${{ !inputs.dry_run }}
    secrets: inherit

  call_docker_build_main_frontend:
    name: Call Docker Build Workflow for Primeagent Frontend
    if: ${{ inputs.build_docker_main && !inputs.dry_run }}
    needs: [call_docker_build_main]
    uses: ./.github/workflows/docker-build-v2.yml
    with:
      ref: ${{ inputs.release_tag }}
      release_type: main-frontend
      pre_release: ${{ inputs.pre_release }}
      push_to_registry: ${{ !inputs.dry_run }}
    secrets: inherit

  call_docker_build_main_ep:
    name: Call Docker Build Workflow for Primeagent with Entrypoint
    if: ${{ inputs.build_docker_main }}
    needs: [ci]
    uses: ./.github/workflows/docker-build-v2.yml
    with:
      ref: ${{ inputs.release_tag }}
      release_type: main-ep
      pre_release: ${{ inputs.pre_release }}
      push_to_registry: ${{ !inputs.dry_run }}
    secrets: inherit

  call_docker_build_main_all:
    name: Call Docker Build Workflow for primeagent-all
    if: ${{ inputs.build_docker_main }}
    needs: [ci]
    uses: ./.github/workflows/docker-build-v2.yml
    with:
      ref: ${{ inputs.release_tag }}
      release_type: main-all
      pre_release: ${{ inputs.pre_release }}
      push_to_registry: ${{ !inputs.dry_run }}
    secrets: inherit

  create_release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-main, publish-main]
    if: |
      always() &&
      !cancelled() &&
      !inputs.dry_run &&
      inputs.create_release &&
      needs.build-main.result == 'success' &&
      needs.publish-main.result == 'success'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-main
          path: dist
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: dist/*
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          generateReleaseNotes: true
          prerelease: ${{ inputs.pre_release }}
          tag: ${{ needs.build-main.outputs.version }}
          allowUpdates: true
          updateOnlyUnreleased: false
