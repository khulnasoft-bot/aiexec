services:
  primeagfent:
    image: khulnasoft/primeagfent:latest # or another version tag on https://hub.docker.com/r/khulnasoft/primeagfent
    pull_policy: always               # set to 'always' when using 'latest' image
    ports:
      - "7860:7860"
    depends_on:
      - postgres
    environment:
      - PRIMEAGFENT_DATABASE_URL=postgresql://primeagfent:primeagfent@postgres:5432/primeagfent
      # This variable defines where the logs, file storage, monitor data and secret keys are stored.
      - PRIMEAGFENT_CONFIG_DIR=/app/primeagfent
    volumes:
      - primeagfent-data:/app/primeagfent

  postgres:
    # Pinned to a specific Debian base (trixie) so the postgres:16 tag does not
    # silently roll its OS underneath us — that roll causes a glibc collation
    # version mismatch warning on existing volumes. Matches the primeagfent image
    # base. See https://github.com/khulnasoft/primeagfent/issues/9608
    image: postgres:16-trixie
    environment:
      POSTGRES_USER: primeagfent
      POSTGRES_PASSWORD: primeagfent
      POSTGRES_DB: primeagfent
    ports:
      - "5432:5432"
    volumes:
      - primeagfent-postgres:/var/lib/postgresql/data

volumes:
  primeagfent-postgres:
  primeagfent-data:
